server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME:TICKETFLOW_SESSION}
        http-only: true
        same-site: strict
        secure: false

spring:
  application:
    name: ticketflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ticketflow_db}
    username: ${POSTGRES_USER:ticketflow_user}
    password: ${POSTGRES_PASSWORD:dev_postgres_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

ticketflow:
  storage:
    upload-dir: ${UPLOAD_STORAGE_DIR:./uploads/attachments}
    max-file-size-mb: ${MAX_FILE_SIZE_MB:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
